name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois, sans annuler celui qui est en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6

      # v5 et non v4 : cette action est composite et appelle upload-artifact
      # en interne. v4 l'épingle sur 4.6.2, encore en node20 — elle n'aurait
      # donc pas levé la dépréciation. v5 épingle 7.0.0, en node24.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
